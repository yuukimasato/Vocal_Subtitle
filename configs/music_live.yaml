# ============================================================
# Vocal Subtitle — 音乐现场场景模板
# ============================================================
# 适用于演唱会、音乐节、Live House 等现场音乐视频。
# 特点: 音乐为主导，人声与乐器深度混合，分离难度最大。

pipeline:

  separation:
    engine: "uvr"                              # 必须 UVR 最强引擎
    uvr_model: "model_bs_roformer_ep_317_sdr_12.9755.ckpt"
    output:
      sample_rate: 16000
      channels: 1
      format: "wav"
      bit_depth: 16

  vad:
    engine: "silero"
    threshold: 0.3                             # 极低阈值，音乐中人声易漏检
    min_speech_duration_ms: 150
    min_silence_duration_ms: 500

  merging:
    min_silence_gap: 0.5
    max_segment_length: 25.0
    padding: 0.08
    adaptive_padding: true
    padding_min: 0.05
    padding_max: 0.25
    pre_split_silence: true
    pre_split_threshold: 0.5
    min_fragment_duration: 0.15
    min_segment_length: 0.3

  # 方案一：音乐背景下 ffmpeg 纯能量检测易失效，降低权重
  ffmpeg_vad:
    enabled: true
    noise_db: -25.0                            # 音乐现场底噪高，提高阈值
    min_speech_duration_ms: 200
    min_silence_duration_ms: 500

  # 方案二：三方法边界融合（音乐场景不启用，ffmpeg 不可靠）
  fusion:
    enabled: false

  # 方案四：ASR 边界精修
  boundary_refinement:
    enabled: true
    max_shrink_ms: 150
    max_extend_ms: 150                         # 音乐背景下多扩展

  # 方案五：LLM 语义合并
  merge_decision:
    fast_merge_max_gap: 0.15
    llm_decision_min_gap: 0.15
    llm_decision_max_gap: 1.00
    hard_split_min_gap: 1.00
    llm_tier: "cascading"
    llm_model: "deepseek-v4-pro"
    llm_fallback_to_rules: true

  # 方案〇：宏观切块
  macro_chunking:
    enabled: true
    auto_enable_threshold: 180.0

  # 方案七：音乐背景下声学校验可靠性降低，放宽参数
  acoustic_validation:
    enabled: true
    max_snap_distance: 0.20                    # 音乐场景更大吸附范围
    generate_report: true
    rms_override_threshold: 0.20               # 放宽 RMS 覆盖阈值

  # 降级模式
  degradation:
    mode: "full"

  # Stage 3.5: 说话人分离
  diarization:
    enabled: true
    engine: "agglomerative"
    distance_threshold: 0.5
    min_speakers: 1
    max_speakers: 10
    use_pca: true
    pca_variance: 0.95

  asr:
    engine: "faster-whisper"
    model: "large-v3"                          # 使用最大模型
    device: "auto"
    compute_type: "float16"
    # language: "zh"                           # 语言锁定，null = 自动检测
    beam_size: 5
    word_timestamps: true
    condition_on_previous_text: false
    vad_filter: false

  # Stage 4.5: LLM 说话人角色标注（可选）
  speaker_role:
    enabled: false
    model: "deepseek-v4-pro"
    temperature: 0.2
    context_hint: null

  subtitle:
    min_duration: 0.5
    max_duration: 4.0
    max_chars_cjk: 16
    max_chars_latin: 36
    max_lines: 2
    gap_handling:
      seamless_threshold: 0.15
      natural_pause_max: 0.8

  llm_optimize:
    enabled: false
    model: "deepseek-v4-pro"
    batch_num: 10
    thread_num: 4
    temperature: 0.2

noise_reduction:
  enabled: true
  stationary: false

cache:
  enabled: true
  directory: "./cache"
  ttl_separation: 86400
  ttl_transcription: 604800

logging:
  level: "INFO"
  format: "json"
  file: "logs/pipeline.log"
