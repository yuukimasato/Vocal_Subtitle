# ============================================================
# Vocal Subtitle — 默认配置
# ============================================================
# 适用于通用场景的默认参数配置。
# 可通过 --profile 参数选择不同的场景模板。

pipeline:

  # 运行模式: "offline" (完整批处理) | "streaming" (实时流式)
  mode: "offline"

  # 流式处理配置 (mode: "streaming" 时生效)
  streaming:
    chunk_duration: 2.0           # 每次处理的音频窗口（秒）
    overlap_duration: 0.5         # 窗口重叠（秒）
    max_latency: 3.0              # 最大允许延迟（秒）
    llm_fallback: "local_nlp"     # 流式 LLM 降级策略: "local_nlp" | "rule_only"
    vad_engine: "silero"          # 流式模式下只用 Silero（最快）

  # Stage 1: 人声分离
  separation:
    engine: "uvr"                              # spleeter | openunmix | uvr
    uvr_model: "model_bs_roformer_ep_317_sdr_12.9755.ckpt"
    output:
      sample_rate: 16000
      channels: 1
      format: "wav"
      bit_depth: 16

  # Stage 2: VAD 语音检测
  vad:
    engine: "silero"                           # silero | ten | webrtc
    threshold: 0.40                            # 更敏感，减少语尾渐弱漏检
    min_speech_duration_ms: 150              # 150ms 捕获短回应（Yeah/OK/Got it）
    min_silence_duration_ms: 350
    # 方案一：ffmpeg silencedetect 并行检测
    ffmpeg_enabled: true
    ffmpeg_noise_db: -35.0
    ffmpeg_weight: 0.4

  # 方案一独立配置：ffmpeg silencedetect VAD
  ffmpeg_vad:
    enabled: true
    noise_db: -35.0
    min_speech_duration_ms: 150
    min_silence_duration_ms: 400

  # 方案二：三方法边界融合 (Silero+ffmpeg+RMS)
  fusion:
    enabled: false                              # Phase 4 启用
    grid_resolution: 0.01                       # 10ms 网格
    min_consensus: 2                            # 2/3 多数决
    high_conf_padding: 0.03
    low_conf_padding: 0.12
    min_speech_duration: 0.25

  # Degradation / fallback mode control
  degradation:
    mode: "full"                   # "full" | "degraded" | "minimal"
    per_module_timeout: 60         # 每个模块最大执行秒数
    ffmpeg_timeout: 30
    llm_api_timeout: 15

  # Stage 3: 片段合并
  merging:
    min_silence_gap: 0.4
    max_segment_length: 20.0        # 30→20，更短更精确
    padding: 0.10                   # 基础填充
    adaptive_padding: true          # 新增：边界能量梯度自适应
    padding_min: 0.05               # 清晰边界最小填充
    padding_max: 0.20               # 模糊边界最大填充
    pre_split_silence: true         # 新增：段内静音预切分
    pre_split_threshold: 0.8       # 内部静音>0.55s则切分（降低敏感度，减少碎片）
    min_fragment_duration: 0.25     # 最小片段250ms保护（减少孤立词字幕）
    protect_single_word: true       # 新增：禁止在单词中间切分
    min_word_gap_ms: 80             # 新增：单词内部允许的最大静音（清辅音间隔）
    min_segment_length: 0.15       # ★ 最小段长（150ms），保留短发声，避免字幕缺漏

  # 方案四：ASR 边界双向精修
  boundary_refinement:
    enabled: true
    max_shrink_ms: 80               # ★ 最多向内收缩（从200降至80，减少过度收缩60%）
    max_extend_ms: 100              # 最多向外扩展
    check_frames: 3                 # 三帧能量斜率校验
    frame_ms: 10
    min_boundary_confidence: 0.5    # ★ 提高精修门槛（0.3→0.5），低置信度词不触发收缩
    shrink_end_enabled: false       # 能量扫描对语尾低能量不可靠，默认关闭

  # Stage 4.6：边界滑动窗口冗余识别（方案八）
  # ── 针对语速快、词间静音不清晰的场景 ──
  #   对低置信度边界做偏移窗口多次 ASR + LLM 语义仲裁，
  #   修正因边界粘连导致的单词分裂（如 "unbearably." | "hot"）。
  #   仅在检测到低置信度边界时触发，不影响正常边界的处理速度。
  boundary_redundancy:
    enabled: true

    # 置信度评估：哪些边界需要冗余处理
    confidence:
      min_gap_trigger: 0.05            # gap < 50ms 触发（几乎紧贴）
      max_energy_slope_trigger: 3.0    # 能量斜率 < 3.0 触发（渐变边界）
      confidence_threshold: 0.5        # 综合分 < 0.5 需要冗余

    # 滑动窗口参数
    sliding_window:
      base_overlap_ms: 500             # 基础重叠量（正常语速 ~2-3词）
      fast_speech_wps: 4.0             # 快速语速阈值（词/秒）
      fast_overlap_ms: 750             # 快速语速重叠量
      very_fast_overlap_ms: 1000       # 极快语速重叠量
      fusion_window_sec: 1.0           # 融合窗半宽（覆盖边界两侧）
      max_workers: 3                   # 并行 ASR 线程数

    # LLM 语义仲裁
    arbitration:
      llm_model: "deepseek-v4-pro"
      # llm_base_url: "https://api.deepseek.com"  # 取消注释并填入
      # llm_api_key: "sk-..."                      # 取消注释并填入
      llm_temperature: 0.1
      llm_timeout: 15.0
      auto_apply_confidence: 0.8       # LLM 置信度 > 80% 自动应用
      review_threshold: 0.5            # 50-80% 标记人工复核
      fallback_to_rules: true          # 无 LLM 时降级到纯规则

  # 方案五：LLM 语义合并决策
  # ── 三层级联（无 GPU 要求）──
  #   gap < 200ms          → 快路径：规则强制合并（<1ms，纯 CPU）
  #   gap 200-600ms        → 本地 NLP：sentence-transformers 语义判断（~30ms，CPU）
  #   gap 600-1200ms       → 云端 LLM：API 调用裁决（~1s，网络）
  #   gap > 1200ms         → 硬规则：强制不合并
  #   本地 NLP 无法裁决的   → 自动升级到云端 LLM
  #  云端 LLM 不可用时       → 自动降级到规则模式
  merge_decision:
    fast_merge_max_gap: 0.30        # <300ms: 规则强制合并（同说话人+短间隔，如"得|了吧"）
    llm_decision_min_gap: 0.30      # 300-1200ms: LLM 决策区间
    llm_decision_max_gap: 1.20
    hard_split_min_gap: 1.20        # >1200ms: 强制不合并
    max_combined_duration: 5.0
    min_fragment_duration: 0.15
    # 渐进降级间隙范围（降本策略，无需本地 GPU）
    local_nlp_gap_range: [0.30, 0.60]  # 本地 NLP 优先（CPU，零成本）
    cloud_llm_gap_range: [0.60, 1.20]  # [0.60, 1.20]：云端 LLM 裁决（仅此范围走 API）
    llm_tier: "cascading"           # cascading(推荐) | all_llm | rule_only
    llm_model: "deepseek-v4-pro"    # 云端模型（需配置 base_url + api_key）
    # llm_base_url: "https://api.deepseek.com"  # 取消注释并填入
    # llm_api_key: "sk-..."                      # 取消注释并填入
    llm_temperature: 0.1
    llm_timeout: 15.0
    llm_fallback_to_rules: true     # 云端不可用时自动回退到规则

  # 方案〇：宏观静音切块（长音频适用）
  macro_chunking:
    enabled: true
    auto_enable_threshold: 180.0    # >3分钟自动启用
    silence_threshold_db: -30
    min_silence_duration: 2.0
    target_chunk_duration: 60.0
    max_chunk_duration: 180.0
    overlap_ms: 200
    recursive: true

  # 方案七：全局声学标尺校验
  acoustic_validation:
    enabled: true
    skeleton_noise_db: -40.0        # 骨架提取阈值（自适应关闭/估计失败时的回退值）
    skeleton_adaptive_noise_db: true # ★ 自适应阈值：噪声底dB+余量，钳制[-45,-30]（noise-shadow 同策略）
    skeleton_noise_margin_db: 10.0   # 自适应余量：阈值 = 噪声底dB + 10
    skeleton_min_silence: 0.1
    skeleton_min_speech: 0.05
    max_snap_distance: 0.15         # ★ 吸附距离从250ms降至150ms
    snap_start_margin: 0.03        # start 吸附后保留 30ms 前导余量
    snap_end_margin: 0.003         # ★ 吸附余量从10ms降至3ms
    confidence_threshold: 0.6
    rms_override_threshold: 0.15
    generate_report: true
    flag_threshold_ms: 200          # >200ms 偏差标记为需复核
    unified_ffmpeg_pass: true       # 与方案一共用 ffmpeg 调用
    skeleton_mode: true             # 骨架分段独立处理模式（默认开启）
    reproject_grouped_windows: true # ★ 聚合窗口结果钳制回物理骨架段（恢复端点静音对齐）
    member_split_min_gap: 0.3       # ★ 成员间隙<0.3s视为句内微停顿不拆文本（呼吸/强调停顿保持整行）
    member_split_max_duration: 5.0  # ★ 聚合组超过5s即使微停顿也要在成员间隙处拆分（兜底防整段长字幕）
    allow_end_shorten: true         # ★ 允许声学标尺缩短结束时间（双向修正）
    allow_start_pull_earlier: true  # ★ 允许声学标尺将 start 向前吸附
    allow_end_extend: true          # ★ 截尾修复：end 落在连续语音骨架段内时延长到该段语音终点（钳制到下一句 start 之前，绝不吞下一句）
    max_start_snap_distance: 0.45   # ★ 吞静音修复：start 后向吸附限幅（ASR 词起点在换人/换句边界普遍偏早 200~300ms，需能量确认）
    # 时间轴仲裁层（2026-09-11 定案，层2）：R1共识/R2盲区/R3空洞三规则表
    timeline_arbitration: false     # 置 true 启用三规则仲裁（回退：改回 false）
    arbitration_r1_min_overlap_chars: 6   # R1 整段信骨架所需最小一致字符数
    arbitration_r1_min_similarity: 0.85   # R1 共识判定的最小字符重合率
    arbitration_r2_local_noise: true      # R2 能量确认用局部噪声画像（防音乐残留误确认）

  # Stage 3.5: 说话人分离
  diarization:
    enabled: true
    engine: "agglomerative"
    distance_threshold: 0.5
    min_speakers: 1
    max_speakers: 10
    use_pca: true
    pca_variance: 0.95
    text_fallback: true                     # 声学聚类失败时启用文本模式降级
    backend: "auto"
    fusion_mode: "auto"
    global_model: "auto"
    diarization_scope: "hierarchical"
    local_refinement: "embedding"
    local_context_seconds: 0.6
    min_local_segment_seconds: 0.25
    min_change_confidence: 0.70
    # 说话人身份主干（2026-09-11 定案，层1）：turns 前置 + 词级后切分
    early_turns: true               # ★ 灰度开启：turns 前置进 ctx（回退：改回 false 即回到后处理聚类）
    word_split_on_turn: false       # ★ 词级后切分：2026-09-13 双人素材实测——无词级时间戳的合并事件走 fallback 拆分会把整段文本压进
                                    #   首个说话人小片段（60ms 塞 12 字），需先修 unworded 事件的词表传递后再开启
    single_speaker_shortcut: true   # 单说话人素材（TTS/口播）自动短路
    # expected_speakers: null                # 自动推断说话人数

  # Stage 4: ASR 识别
  asr:
    engine: "auto"                             # auto | faster-whisper | whisper-cpp | funasr | qwen
    model: "large-v3"
    qwen_model_path: null                       # null = ~/.cache/vocal-subtitle/review-models/qwen3-asr-1.7b
    device: "auto"
    compute_type: "float16"
    # language: "zh"                           # 语言锁定，null = 自动检测
    # whisper.cpp 可执行文件与 GGML/GGUF 模型的显式路径（仅 whisper.cpp 使用）
    # whisper_cpp_bin: "/usr/local/bin/whisper-cli"
    # whisper_cpp_model_path: "/models/ggml-medium.bin"
    beam_size: 5
    word_timestamps: true
    condition_on_previous_text: false          # 每段独立，防止跨段幻觉
    vad_filter: false                          # 关闭内置 VAD，使用 Stage 2
    language_mode: "single"                    # single | mixed | auto

    # 全局转录（完整音频为窗口）
    global_asr:
      enabled: true
      routing: "segmented"                     # segmented | global (compatibility) | global_primary (experimental, gated)
      evidence_enabled: true                   # global ASR as evidence after segmented primary
      alignment_enabled: true                  # WhisperX 词级强制对齐（仅后端支持 align() 时生效；失败自动回退 ASR 原词时间）
      backend: "faster-whisper"
      left_context: 0.5
      right_context: 0.5
      max_window_duration: 180.0
      window_overlap: 0.5
      min_word_confidence: 0.0
      hallucination_filter: true
      language_switch_threshold: 0.7

    # 自动语言路由与质量门禁
    auto_routing:
      enabled: true
      language_probe_model: "tiny"
      language_probe_window_seconds: 8.0
      language_probe_max_windows: 8
      zh_min_probability: 0.85
      zh_required_window_ratio: 1.0
      uncertain_window_policy: "faster-whisper"
      fallback_on_quality_failure: true
      fallback_engine: "faster-whisper"
      route_version: "asr-route-v1"
      quality_gate_version: "asr-quality-v1"
      min_coverage_ratio: 0.80
      min_text_density: 0.20
      max_event_duration: 12.0
      long_audio_seconds: 60.0
      long_audio_min_text_chars: 12
      max_overlap_ratio: 0.35
    engine_pair:
      enabled: true
      primary: "auto"
      secondary: "auto"
      policy: "risk_only"
      same_family_policy: "reject"
      fallback_secondary: true
      max_workers: 2
      route_version: "asr-pair-v1"

  # 全局 ASR 证据复核（production 默认；可显式切回 shadow）
  evidence_review:
    enabled: true
    authoritative_mode: false
    shadow_mode: true
    context_reasr_enabled: false
    context_reasr_min_level: "medium"         # 风险门控下限：medium(现状) | high(仅 high/critical/冲突窗口)
    qwen_enabled: false
    forced_aligner_enabled: false
    sed_enabled: false
    semantic_review_enabled: false
    unresolved_keeps_candidate: true
    require_multi_source_drop: true
    fallback_to_segmented: true
    local_recovery_enabled: true
    local_recovery_max_attempts: 3
    local_recovery_min_confidence: 0.5
    local_recovery_context_seconds: 0.5
    local_recovery_request_tolerance: 0.15
    qwen_model_path: null
    forced_aligner_model_path: null
    sed_model_path: null
    review_device: "auto"
    allow_remote_model_download: false
    left_context: 0.8
    right_context: 0.8
    max_group_duration: 12.0
    max_window_duration: 15.0
    medium_threshold: 0.25
    high_threshold: 0.50
    critical_threshold: 0.75
    max_workers: 2
    window_timeout_seconds: 60.0
    review_policy_version: "review-policy-v1"
    risk_policy_version: "risk-policy-v1"
    decision_policy_version: "decision-policy-v1"
    evidence_schema_version: "evidence-v1"
    golden_quality_gate_version: "golden-quality-v1"

  # Stage 4.5: LLM 说话人角色标注（可选）
  speaker_role:
    enabled: false
    model: "deepseek-v4-pro"
    temperature: 0.2
    context_hint: null

  # 说话人嵌入模型（提升声学聚类精度）
  # 默认使用 speechbrain/ecapa (Apache 2.0, 无需签署协议, 开箱即用)
  # 如需更高精度，可切换至 pyannote/embedding (需在 huggingface.co 签署协议)
  speaker_embedding:
    enabled: true                       # 默认启用
    engine: "pyannote"                  # pyannote | dummy
    model_ref: "speechbrain/spkrec-ecapa-voxceleb"  # 默认 Apache 2.0 模型
    hf_token: ""                        # speechbrain 无需 token；切换 pyannote 时需填写
    cache_dir: ""                       # 留空 = cache/speaker_models/

  # Stage 5: 字幕构建
  subtitle:
    min_duration: 0.8
    max_duration: 5.0
    max_chars_cjk: 20
    max_chars_latin: 42
    max_lines: 2
    gap_handling:
      seamless_threshold: 0.2
      natural_pause_max: 1.0
    # 帧级无缝衔接（消除字幕闪烁）
    frame_seamless: true           # 非句尾字幕自动衔接到下一句
    max_stitch_gap: 0.12           # 最多衔接 120ms 的间隙

  # 可选: LLM 后处理（默认关闭，需配置 API 密钥后手动开启）
  llm_optimize:
    enabled: false                          # 默认关闭（避免 LLM 意外翻译、改动语义）
    model: "deepseek-v4-pro"
    batch_num: 10
    thread_num: 4
    temperature: 0.2

# 噪声抑制 / 环境底噪自适应（可选）
# 也支持以 "noise_adaptation" 键名配置（向下兼容文档命名）
noise_reduction:
  enabled: false                 # 默认关闭，纯净录音不需要
  engine: "spectral_gate"        # spectral_gate | rnnoise | deepfilternet
  spectral_noise_reduction_db: 12.0
  spectral_noise_estimation_frames: 10
  burst_noise_protection: true
  burst_noise_threshold_db: 15.0
  burst_noise_max_duration_ms: 200

# 缓存
cache:
  enabled: true
  directory: "./cache"
  ttl_separation: 86400       # 24 小时
  ttl_transcription: 604800   # 7 天

# 日志
logging:
  level: "INFO"
  format: "json"              # json | console
  file: "logs/pipeline.log"

# 反馈学习（全部可选，缺省见 FeedbackConfig）
feedback:
  journal_sink_retention: "archive"  # ingest 消费成功后 sink 源文件处理：archive=归档到 consumed/ | delete=直接删除
  journal_sink_ttl_days: 30          # 未消费 sink 文件 TTL 兜底清理（天；<=0 禁用清理）
