# ============================================================
# Vocal Subtitle — 综艺/直播场景模板
# ============================================================
# 适用于综艺节目、直播录像等含丰富背景音的视频。
# 特点: 背景音乐/笑声/音效混杂，需要强力分离和降噪。

pipeline:

  separation:
    engine: "uvr"                              # 综艺需要最强分离能力
    uvr_model: "model_bs_roformer_ep_317_sdr_12.9755.ckpt"
    output:
      sample_rate: 16000
      channels: 1
      format: "wav"
      bit_depth: 16

  vad:
    engine: "silero"
    threshold: 0.35                            # 更低的阈值防止漏检
    min_speech_duration_ms: 200
    min_silence_duration_ms: 300               # 综艺节奏快，静音短

  merging:
    min_silence_gap: 0.3                       # 快速合并
    max_segment_length: 25.0                   # 较短的段长限制
    padding: 0.08
    adaptive_padding: true                     # 综艺背景音复杂，自适应重要
    padding_min: 0.05
    padding_max: 0.25                          # 嘈杂环境允许更大 padding
    pre_split_silence: true
    pre_split_threshold: 0.4                   # 综艺节奏快，较短静音即切分
    min_fragment_duration: 0.15
    min_segment_length: 0.3

  # 方案一：ffmpeg VAD（综艺背景音复杂，ffmpeg 纯能量检测降低灵敏度）
  ffmpeg_vad:
    enabled: true
    noise_db: -30.0                            # 比默认高，减少背景音乐误检
    min_speech_duration_ms: 200
    min_silence_duration_ms: 400

  # 方案二：三方法边界融合（综艺嘈杂环境收益大）
  fusion:
    enabled: false                             # Phase 4 启用

  # 方案四：ASR 边界精修
  boundary_refinement:
    enabled: true
    max_shrink_ms: 150                         # 综艺保守收缩
    max_extend_ms: 120                         # 综艺需要更多扩展（背景音干扰）

  # 方案五：LLM 语义合并
  merge_decision:
    fast_merge_max_gap: 0.15                   # 综艺字幕切换快，更小的快合并阈值
    llm_decision_min_gap: 0.15
    llm_decision_max_gap: 1.00
    hard_split_min_gap: 1.00
    llm_tier: "cascading"
    llm_model: "deepseek-v4-pro"
    llm_fallback_to_rules: true

  # 方案〇：宏观切块
  macro_chunking:
    enabled: true
    auto_enable_threshold: 180.0

  # 方案七：声学校验（音乐背景下可靠性降低，增大吸附距离）
  acoustic_validation:
    enabled: true
    max_snap_distance: 0.18                    # 嘈杂环境放宽吸附距离
    generate_report: true

  # 降级模式
  degradation:
    mode: "full"

  # Stage 3.5: 说话人分离（可选）
  diarization:
    enabled: true
    engine: "agglomerative"
    distance_threshold: 0.5
    min_speakers: 1
    max_speakers: 10
    use_pca: true
    pca_variance: 0.95

  asr:
    engine: "faster-whisper"
    model: "large-v3"
    device: "auto"
    compute_type: "float16"
    # language: "zh"                           # 语言锁定，null = 自动检测
    beam_size: 5
    word_timestamps: true
    condition_on_previous_text: false
    vad_filter: false

  # Stage 4.5: LLM 说话人角色标注（可选）
  speaker_role:
    enabled: true
    model: "deepseek-v4-pro"
    temperature: 0.2
    context_hint: null

  subtitle:
    min_duration: 0.6                          # 综艺字幕切换快
    max_duration: 4.0
    max_chars_cjk: 16
    max_chars_latin: 36
    max_lines: 2
    gap_handling:
      seamless_threshold: 0.15
      natural_pause_max: 0.8

  llm_optimize:
    enabled: true                             # 综艺建议开启 LLM 修正
    model: "deepseek-v4-pro"
    batch_num: 10
    thread_num: 4
    temperature: 0.2

noise_reduction:
  enabled: true                                # 综艺建议开启降噪
  stationary: false                            # 综艺背景音非稳态

cache:
  enabled: true
  directory: "./cache"
  ttl_separation: 86400
  ttl_transcription: 604800

logging:
  level: "INFO"
  format: "json"
  file: "logs/pipeline.log"
