# Diagnostic-only fixtures. They are consumed by contract tests and are not
# included in the production reference denominator unless an audio and
# reference artifact is explicitly attached to a scene above.
diagnostic_fixtures:
  - id: "diagnostic-short-response-150ms"
    fixture_kind: short_response
    reference_role: diagnostic_only
    expected_events:
      - {id: "expected:short:0001", start: 0.40, end: 0.55, text: "好"}
      - {id: "expected:short:0002", start: 2.10, end: 2.25, text: "嗯"}
      - {id: "expected:short:0003", start: 4.60, end: 4.75, text: "对"}
  - id: "diagnostic-trailing-speech-2s"
    fixture_kind: trailing_speech
    reference_role: diagnostic_only
    expected_events:
      - {id: "expected:tail:0001", start: 8.00, end: 10.00, text: "最后一句仍在说话"}
    physical_speech_spans:
      - {id: "physical:tail:0001", start: 8.00, end: 10.00}
  - id: "diagnostic-overlap-ownership"
    fixture_kind: overlap_ownership
    reference_role: diagnostic_only
    expected_events:
      - {id: "expected:overlap:0001", start: 1.00, end: 1.80, text: "甲的内容", speaker_id: 1, owner: "speaker-1"}
      - {id: "expected:overlap:0002", start: 1.40, end: 2.20, text: "乙的回应", speaker_id: 2, owner: "speaker-2"}
    physical_speech_spans:
      - {id: "physical:overlap:0001", start: 1.00, end: 1.80, speaker_id: 1, owner: "speaker-1"}
      - {id: "physical:overlap:0002", start: 1.40, end: 2.20, speaker_id: 2, owner: "speaker-2"}
